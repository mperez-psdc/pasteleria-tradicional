<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicios · Pastelería Tradicional</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <div id="marco"></div>
  <script src="../js/datos.js"></script>
  <script src="../js/comun.js"></script>
  <script>
    const UI = PasteleriaUI;
    const Datos = Pasteleria;
    if (UI.iniciar({ rol: "gerencia", titulo: "Luz, agua y teléfono", fase: "Fase 4" })) {
      UI.contenido().addEventListener("click", function (evento) {
        const boton = evento.target.closest("[data-servicio]");
        if (!boton) return;
        const resultado = Datos.registrarServicio(boton.getAttribute("data-servicio"));
        if (!resultado.ok) {
          UI.mensaje(resultado.error, "error");
          return;
        }
        pintar();
        UI.mensaje(resultado.aviso, "ok");
      });
      pintar();
    }

    function pintar() {
      const datos = Datos.cargar();
      const filas = datos.servicios.map(function (servicio) {
        const vencido = servicio.estado === "pendiente" && servicio.vence < Datos.hoy();
        const accion = servicio.estado === "registrado"
          ? "Registrado el " + UI.esc(Datos.fechaCorta(servicio.registradoEn))
          : '<button type="button" data-servicio="' + UI.esc(servicio.id) + '">Marcar como registrado</button>';
        return "<tr" + (vencido ? " class='atrasada'" : "") + "><td>" + UI.esc(servicio.nombre) + "</td><td>" + UI.esc(Datos.dinero(servicio.monto)) + "</td><td>" + UI.esc(Datos.fechaCorta(servicio.vence)) + "</td><td>" + (vencido ? "Vencido" : UI.esc(servicio.estado)) + "</td><td>" + accion + "</td></tr>";
      }).join("");
      UI.contenido().innerHTML =
        '<p class="ayuda">Calendario y registro. Marcar un pago no debita el banco: evita que el recibo se olvide en un cajón.</p>' +
        '<div class="panel"><div class="tabla-wrap"><table><thead><tr><th>Servicio</th><th>Monto</th><th>Vence</th><th>Estado</th><th></th></tr></thead><tbody>' + filas + "</tbody></table></div></div>";
    }
  </script>
</body>
</html>
