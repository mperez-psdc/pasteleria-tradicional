<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal · Pastelería Tradicional</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <div id="marco"></div>
  <script src="../js/datos.js"></script>
  <script src="../js/comun.js"></script>
  <script>
    const UI = PasteleriaUI;
    const Datos = Pasteleria;
    if (UI.iniciar({ rol: "gerencia", titulo: "Cumplimiento del personal", fase: "Fase 4" })) {
      const datos = Datos.cargar();
      const filas = datos.pasteleros.map(function (persona) {
        const suyas = datos.tareas.filter(function (tarea) { return tarea.pasteleroId === persona.id && tarea.estado !== "anulada"; });
        const cerradas = suyas.filter(function (tarea) { return tarea.estado === "terminada"; });
        const aTiempo = cerradas.filter(function (tarea) { return tarea.aTiempo; }).length;
        const abiertas = Datos.tareasAbiertas(datos, persona.id).length;
        const atrasadas = suyas.filter(function (tarea) { return tarea.estado === "pendiente" && tarea.fechaEntrega < Datos.hoy(); }).length;
        return "<tr><td>" + UI.esc(persona.nombre) + "</td><td>" + suyas.length + "</td><td>" + cerradas.length + "</td><td>" + aTiempo + "</td><td>" + abiertas + "</td><td>" + atrasadas + "</td></tr>";
      }).join("");
      UI.contenido().innerHTML =
        '<p class="ayuda">Se mira el cumplimiento de tareas y fechas. No se publica un ranking en el local ni se vigila el tiempo de cada persona. Las recetas no están en este sistema.</p>' +
        '<div class="panel"><div class="tabla-wrap"><table><thead><tr><th>Pastelero</th><th>Tareas</th><th>Cerradas</th><th>Cerradas a tiempo</th><th>Abiertas</th><th>Atrasadas</th></tr></thead><tbody>' + filas + "</tbody></table></div></div>";
    }
  </script>
</body>
</html>
