<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libro · Pastelería Tradicional</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <div id="marco"></div>
  <script src="../js/datos.js"></script>
  <script src="../js/comun.js"></script>
  <script>
    const UI = PasteleriaUI;
    const Datos = Pasteleria;
    if (UI.iniciar({ rol: "contador", titulo: "Libro de ingresos y gastos", fase: "Fase 1" })) pintar();

    function pintar() {
      const datos = Datos.cargar();
      const ingresos = [];
      datos.pedidos.forEach(function (pedido) {
        pedido.pagos.forEach(function (pago) {
          ingresos.push({ fecha: pago.fecha, concepto: pedido.numero + " · " + pedido.clienteNombre, monto: pago.monto });
        });
      });
      (datos.ventas || []).forEach(function (venta) {
        ingresos.push({ fecha: venta.fecha, concepto: "Venta ilustrativa · " + venta.nombre, monto: venta.total });
      });
      ingresos.sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; });
      const gastos = (datos.gastos || []).slice().sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; });
      UI.contenido().innerHTML =
        '<p class="aviso warn">Libro interno. No es contabilidad fiscal ni reemplaza a un contador.</p>' +
        '<form class="panel" id="gasto"><h2>Registrar gasto</h2><div class="rejilla-2"><label>Concepto<input name="concepto" required maxlength="80" placeholder="Salarios de la quincena"></label><label>Tipo<select name="categoria"><option value="nomina">Salarios</option><option value="servicio">Servicio</option><option value="otro">Otro</option></select></label><label>Monto<input type="number" name="monto" min="0.01" step="0.01" required></label></div><button type="submit">Anotar</button></form>' +
        '<div class="rejilla-2" style="margin-top:1rem">' +
          '<section class="panel"><h2>Ingresos recientes</h2><div class="tabla-wrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th></tr></thead><tbody>' + ingresos.slice(0, 12).map(function (fila) { return "<tr><td>" + UI.esc(Datos.fechaCorta(fila.fecha)) + "</td><td>" + UI.esc(fila.concepto) + "</td><td>" + UI.esc(Datos.dinero(fila.monto)) + "</td></tr>"; }).join("") + "</tbody></table></div></section>" +
          '<section class="panel"><h2>Gastos recientes</h2><div class="tabla-wrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th></tr></thead><tbody>' + gastos.slice(0, 12).map(function (fila) { return "<tr><td>" + UI.esc(Datos.fechaCorta(fila.fecha)) + "</td><td>" + UI.esc(fila.concepto) + "</td><td>" + UI.esc(Datos.dinero(fila.monto)) + "</td></tr>"; }).join("") + "</tbody></table></div></section>" +
        "</div>";
      document.getElementById("gasto").addEventListener("submit", function (evento) {
        evento.preventDefault();
        const forma = new FormData(evento.target);
        const resultado = Datos.registrarGasto(forma.get("concepto"), forma.get("categoria"), forma.get("monto"));
        if (!resultado.ok) {
          UI.mensaje(resultado.error, "error");
          return;
        }
        pintar();
        UI.mensaje("Gasto anotado.", "ok");
      });
    }
  </script>
</body>
</html>
