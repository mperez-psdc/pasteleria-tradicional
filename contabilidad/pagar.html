<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuentas por pagar · Pastelería Tradicional</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <div id="marco"></div>
  <script src="../js/datos.js"></script>
  <script src="../js/comun.js"></script>
  <script>
    const UI = PasteleriaUI;
    const Datos = Pasteleria;
    if (UI.iniciar({ rol: "contador", titulo: "Cuentas por pagar", fase: "Fase 1" })) {
      UI.contenido().addEventListener("click", function (evento) {
        const boton = evento.target.closest("[data-id]");
        if (!boton) return;
        const resultado = Datos.pagarCuenta(boton.getAttribute("data-id"));
        if (!resultado.ok) {
          UI.mensaje(resultado.error, "error");
          return;
        }
        pintar();
        UI.mensaje(resultado.aviso, "ok");
      });
      pintar();
    }

    function pintar() {
      const datos = Datos.cargar();
      const filas = (datos.cuentas || []).slice().reverse().map(function (cuenta) {
        const vencida = cuenta.estado === "pendiente" && cuenta.vence < Datos.hoy();
        const accion = cuenta.estado === "pendiente"
          ? '<button type="button" data-id="' + UI.esc(cuenta.id) + '">Registrar pago</button>'
          : "Pagada el " + UI.esc(Datos.fechaCorta(cuenta.pagadaEn));
        return "<tr" + (vencida ? " class='atrasada'" : "") + "><td>" + UI.esc(cuenta.concepto) + "</td><td>" + UI.esc(Datos.dinero(cuenta.monto)) + "</td><td>" + UI.esc(Datos.fechaCorta(cuenta.vence)) + "</td><td>" + (vencida ? "Vencida" : UI.esc(UI.estadoTexto(cuenta.estado))) + "</td><td>" + accion + "</td></tr>";
      }).join("");
      UI.contenido().innerHTML =
        '<p class="ayuda">Nacen al recibir una orden de compra. Registrar el pago no debita un banco.</p>' +
        '<div class="panel"><div class="tabla-wrap"><table><thead><tr><th>Concepto</th><th>Monto</th><th>Vence</th><th>Estado</th><th></th></tr></thead><tbody>' + (filas || "<tr><td colspan='5'>No hay cuentas.</td></tr>") + "</tbody></table></div></div>";
    }
  </script>
</body>
</html>
