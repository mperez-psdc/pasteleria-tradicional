<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Pastelería Tradicional</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="login">
    <section class="panel entrada">
      <p class="marca-login">Pastelería Tradicional</p>
      <h1>Entrar al sistema</h1>
      <p class="ayuda">Demostración. Las claves están a la vista y no protegen nada de verdad. Cada persona ve los módulos de su usuario. Administración ve todos.</p>
      <form id="entrar">
        <label>Usuario<input name="usuario" autocomplete="username" required value="admin"></label>
        <label>Clave<input name="clave" type="password" autocomplete="current-password" required value="admin"></label>
        <button type="submit">Entrar</button>
      </form>
      <p id="error" class="aviso error" hidden></p>
      <p id="aviso" class="aviso" hidden></p>
      <h2>Usuarios de prueba</h2>
      <div class="tabla-wrap"><table><thead><tr><th>Usuario</th><th>Clave</th><th>Ve</th></tr></thead><tbody id="lista"></tbody></table></div>
      <p class="fila" style="margin-top:1rem"><a href="publico/inicio.html">Ver la vitrina sin entrar</a></p>
    </section>
  </main>
  <script src="js/datos.js"></script>
  <script src="js/comun.js"></script>
  <script>
    const datos = Pasteleria.cargar();
    const cuerpos = {
      admin: "Todo el sistema",
      cajero: "Ventas y caja",
      pastelero: "Cocina",
      contador: "Contabilidad y reportes",
      cliente: "Catálogo, pedido y perfil",
    };
    const avisoGuardado = sessionStorage.getItem("aviso");
    if (avisoGuardado) {
      sessionStorage.removeItem("aviso");
      const aviso = document.getElementById("aviso");
      aviso.hidden = false;
      aviso.textContent = avisoGuardado;
    }
    document.getElementById("lista").innerHTML = datos.usuarios.map(function (usuario) {
      return "<tr><td><button type='button' class='secundario' data-usuario='" + usuario.usuario + "'>" + usuario.usuario + "</button></td><td>" + usuario.clave + "</td><td>" + (cuerpos[usuario.rol] || usuario.rol) + "</td></tr>";
    }).join("");
    document.getElementById("lista").addEventListener("click", function (evento) {
      const boton = evento.target.closest("[data-usuario]");
      if (!boton) return;
      const usuario = datos.usuarios.find(function (item) { return item.usuario === boton.getAttribute("data-usuario"); });
      document.querySelector("[name=usuario]").value = usuario.usuario;
      document.querySelector("[name=clave]").value = usuario.clave;
    });
    document.getElementById("entrar").addEventListener("submit", function (evento) {
      evento.preventDefault();
      const forma = new FormData(evento.target);
      const resultado = Pasteleria.validarUsuario(forma.get("usuario"), forma.get("clave"));
      const error = document.getElementById("error");
      if (!resultado.ok) {
        error.hidden = false;
        error.textContent = resultado.error;
        return;
      }
      PasteleriaUI.entrarUsuario(resultado.usuario);
    });
  </script>
</body>
</html>
